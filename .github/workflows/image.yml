# Builds the linux/arm64 image for this branch and pushes it to
# ghcr.io/<owner>/stalwart. Mirrors the aarch64-unknown-linux-gnu leg of
# ci.yml (same docker-bake.hcl / Dockerfile.build, features and jemalloc
# page size) without the other platforms, Docker Hub, or releases.
name: Image

on:
  push:
    branches: [meili-sort]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build / aarch64-unknown-linux-gnu
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /mnt /

      - name: Add swap
        run: |
          swap_dir=""
          for dir in /mnt /; do
            if [ -d "$dir" ] && [ "$(df --output=avail -k "$dir" | tail -1)" -ge 18874368 ]; then
              swap_dir="$dir"
              break
            fi
          done
          if [ -z "$swap_dir" ]; then
            echo "Insufficient space for swap on /mnt or /, aborting swap setup"
            df -h
            exit 1
          fi
          sudo fallocate -l 16G "${swap_dir%/}/swapfile"
          sudo chmod 600 "${swap_dir%/}/swapfile"
          sudo mkswap "${swap_dir%/}/swapfile"
          sudo swapon "${swap_dir%/}/swapfile"
          sudo sysctl vm.swappiness=80

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["https://mirror.gcr.io"]
          driver-opts: |
            network=host

      - name: Log In to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Extract Metadata for Docker
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/bake-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          GITHUB_TOKEN: ${{ github.token }}
          TARGET: aarch64-unknown-linux-gnu
          GHCR_REPO: ghcr.io/${{ github.repository }}
          BUILD_ENV: "JEMALLOC_SYS_WITH_LG_PAGE=16 "
          DOCKER_PLATFORM: linux/arm64
          SUFFIX: ""
        with:
          source: .
          set: |
            image.output=type=image,push=true
          files: |
            docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          targets: build,image
